services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitpro
      POSTGRES_PASSWORD: fitpro
      POSTGRES_DB: fitpro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpro"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://fitpro:fitpro@db:5432/fitpro
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
      LOCAL_STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_AUTH_MODE: local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
